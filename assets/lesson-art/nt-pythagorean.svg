<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-labelledby="title"><title id="title">Pythagorean triples: 3² + 4² = 5²</title><rect width="600" height="260" rx="18" fill="#e4f1ff"/><path d="M0 19 L600 19" stroke="#a1cbf2" stroke-opacity=".35" stroke-width="2"/><path d="M21 0 V260" stroke="#a1cbf2" stroke-opacity=".45" stroke-width="2"/><text x="33" y="102" fill="#173354" font-size="34" font-family="Trebuchet MS,Segoe UI,Arial,sans-serif" font-weight="700">3² + 4² = 5²</text><text x="33" y="144" fill="#5a6c83" font-size="19" font-family="Trebuchet MS,Segoe UI,Arial,sans-serif">Pythagorean triples</text><path d="M320 190 L490 190 L320 62 Z" stroke="#1a355b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="338" y="179" fill="#1a355b" font-family="Trebuchet MS,Segoe UI,sans-serif" font-size="19" font-weight="700">3</text><text x="402" y="209" fill="#1a355b" font-family="Trebuchet MS,Segoe UI,sans-serif" font-size="19" font-weight="700">4</text><text x="408" y="115" fill="#1a355b" font-family="Trebuchet MS,Segoe UI,sans-serif" font-size="19" font-weight="700">5</text></svg>