<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-labelledby="title"><title id="title">pr multinomial: pr multinomial: pr multinomial: multiple outcomes: n!/(n₁!n₂!n₃!)</title><rect x="0" y="0" width="600" height="260" rx="18" fill="#fff6d7" stroke="none" stroke-width="2" /><line x1="0" y1="23" x2="600" y2="23" stroke="#b3cbd6" stroke-width="1" stroke-linecap="round" /><line x1="21" y1="0" x2="21" y2="260" stroke="#b3cbd6" stroke-width="1.2" stroke-linecap="round" /><text x="33" y="109" text-anchor="start" font-family="Trebuchet MS, Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#183452">n₁+n₂+n₃ = n</text><text x="34" y="147" text-anchor="start" font-family="Trebuchet MS, Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#5b7187">multiple outcomes</text><line x1="305" y1="53" x2="305" y2="211" stroke="#ffffffaa" stroke-width="2" stroke-linecap="round" /><rect x="358" y="101" width="54" height="64" rx="8" fill="white" stroke="#216bd0" stroke-width="2" /><text x="385" y="130" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#183452">A</text><text x="385" y="151" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#5b7187">3</text><rect x="437" y="101" width="54" height="64" rx="8" fill="white" stroke="#159588" stroke-width="2" /><text x="464" y="130" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#183452">B</text><text x="464" y="151" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#5b7187">2</text><rect x="516" y="101" width="54" height="64" rx="8" fill="white" stroke="#e6b543" stroke-width="2" /><text x="543" y="130" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#183452">C</text><text x="543" y="151" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#5b7187">4</text><text x="439" y="198" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#5b7187">3 + 2 + 4 = 9 trials</text></svg>